services:
  mysql:
    image: mysql:8.4.11
    restart: "no"
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-RootHuellitas2026_Local}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-clinica_huellitas}"
      MYSQL_USER: "${MYSQL_USER:-ad301}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-Huellitas2026_Local}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

volumes:
  mysql_data:
